plugins {
    id 'war'
    id 'org.springframework.boot' version '4.2.0'
    id 'jacoco'
    id 'org.sonarqube' version '7.6.0.18749'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openrewrite.rewrite' version '7.41.0'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-webmvc"
    implementation "org.springframework.boot:spring-boot-starter-actuator"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    testImplementation "org.springframework.boot:spring-boot-starter-restclient-test"

    rewrite 'org.openrewrite.recipe:rewrite-migrate-java:latest.release'
    rewrite 'org.openrewrite.recipe:rewrite-spring:latest.release'
    rewrite 'org.openrewrite.recipe:rewrite-java-dependencies:latest.release'
}

group = 'com.martinbg'
version = '0.0.1-SNAPSHOT'
description = 'Electricity-API'
java.sourceCompatibility = JavaVersion.VERSION_25

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport

    testLogging {
        events = ['passed', 'skipped', 'failed']
        exceptionFormat = 'full'
        showStandardStreams = false
    }
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        csv.required = false
        html.required = false
    }
}

jacoco {
    toolVersion = '0.8.16'
}

sonar {
    properties {
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.organization', 'mark79-github'
        property 'sonar.projectKey', 'Electricity-API'
        property 'sonar.projectName', 'Electricity-API'
        property 'sonar.token', System.getenv('SONAR_TOKEN')
        property 'sonar.projectVersion', version
        property 'sonar.sources', 'src/main/java'
        property 'sonar.tests', 'src/test/java'
        property 'sonar.java.binaries', 'build/classes/java/main'
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    jvmArgs += ["-Xshare:off"]
}

rewrite {
    activeRecipe 'org.openrewrite.java.migrate.UpgradeToJava25'
    activeRecipe 'org.openrewrite.java.spring.boot4.UpgradeSpringBoot_4_0'
    activeRecipe 'org.openrewrite.gradle.UpdateGradleWrapper'
    activeRecipe 'com.martinbg.UpgradeBuildDependencies'
    exportDatatables = true
}